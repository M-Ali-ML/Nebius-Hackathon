  <text x="48" y="486" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">Else: no clear counterpart</text>
  <text x="48" y="508" fill="#64748b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">run match</text>

  <g filter="url(#shadow)">
