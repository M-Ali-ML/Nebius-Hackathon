  <text x="1022" y="166" fill="#1e293b" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="18" font-weight="700">Top 10</text>
  <text x="1022" y="190" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">2048-d cosine</text>
  <text x="1022" y="210" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">P@1 0.56</text>
  <text x="1022" y="234" fill="#64748b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">your GPU</text>

  <g filter="url(#shadow)">
