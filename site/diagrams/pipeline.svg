  <text x="48" y="166" fill="#1e293b" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="18" font-weight="700">100 scans</text>
  <text x="48" y="190" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">Fixed sample</text>
  <text x="48" y="210" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">seed 20261016</text>
  <text x="48" y="234" fill="#64748b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">data fetch</text>

  <g filter="url(#shadow)">
    <rect x="268" y="108" width="210" height="150" rx="14" fill="#e7f6f4" stroke="#7dcec4"/>
  </g>
  <text x="284" y="136" fill="#0f6e68" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1">2  |  PARSE 3.5</text>
  <text x="284" y="166" fill="#1e293b" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="18" font-weight="700">100 / 100</text>
  <text x="284" y="190" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">Blocks, class, bbox</text>
  <text x="284" y="210" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">2 pages: column split</text>
  <text x="284" y="234" fill="#64748b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">nemotron-challenge parse</text>

  <g filter="url(#shadow)">
    <rect x="514" y="108" width="210" height="150" rx="14" fill="#ffffff" stroke="#d7e0ea"/>
  </g>
  <text x="530" y="136" fill="#64748b" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1">3  |  ENTRIES</text>
  <text x="530" y="166" fill="#1e293b" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="18" font-weight="700">262 entries</text>
