  <text x="812" y="480" fill="#b45309" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="12" font-weight="600">superseded 13%</text>
  <text x="620" y="504" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="12" font-weight="600">dropped 38%  |  about 1 spelling edit per 100 words</text>

