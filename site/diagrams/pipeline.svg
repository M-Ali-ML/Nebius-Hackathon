  <text x="1258" y="190" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">+ margin + title</text>
  <text x="1258" y="210" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">P@1 0.70</text>
  <text x="1258" y="234" fill="#64748b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">your GPU</text>

