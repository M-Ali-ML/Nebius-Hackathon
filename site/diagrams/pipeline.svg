  <text x="1016" y="442" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">89 two-column</text>
  <text x="1016" y="462" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">Static site</text>
  <text x="1016" y="486" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">site/index.html</text>
  <text x="1016" y="508" fill="#64748b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">run site</text>

  <g filter="url(#shadow)">
    <rect x="1248" y="360" width="196" height="168" rx="14" fill="#fff6ee" stroke="#fdba74"/>
  </g>
  <text x="1264" y="388" fill="#c2410c" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1">11  |  HERMES</text>
  <text x="1264" y="418" fill="#1e293b" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="18" font-weight="700">6 cases</text>
  <text x="1264" y="442" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">3 success</text>
  <text x="1264" y="462" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">3 failure</text>
  <text x="1264" y="486" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13">Saved transcripts</text>
  <text x="1264" y="508" fill="#64748b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">run agent</text>

  <!-- Card 11 ends at 1444. Canvas 1480. Row 2 card widths: 
       32+250=282, gap 36 to 318. 318+250=568, gap 36 to 604. 604+360=964, gap 36 to 1000.
       1000+212=1212, gap 36 to 1248. 1248+196=1444. OK. -->

  <path d="M282 444 H 318" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#slate)"/>
  <path d="M568 444 H 604" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#slate)"/>
  <path d="M964 444 H 1000" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#slate)"/>
  <path d="M1212 444 H 1248" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#slate)"/>

  <text x="40" y="580" fill="#16324f" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16" font-weight="700">Citation on every factual sentence</text>
  <g>
    <rect x="40" y="596" width="150" height="32" rx="8" fill="#ffffff" stroke="#d7e0ea"/>
    <text x="115" y="617" fill="#1e293b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle">[B:1910:0]</text>
    <rect x="202" y="596" width="230" height="32" rx="8" fill="#ffffff" stroke="#d7e0ea"/>
    <text x="317" y="617" fill="#1e293b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle">[W:61344:1353843790]</text>
