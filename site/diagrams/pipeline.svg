  <text x="450" y="617" fill="#475569" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="14">Britannica entry row:index, and Wikipedia page id:revision id.</text>

  <rect x="32" y="652" width="1416" height="48" rx="12" fill="#12263a"/>
  <text x="52" y="682" fill="#ffffff" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="14">P@1 is on 27 gold-in-pool labels, one reader. Drift shares count only quotes that passed the substring check. OCR noise still inflates renamed and superseded.</text>
</svg>
