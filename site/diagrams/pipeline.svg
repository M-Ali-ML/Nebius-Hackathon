<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 720" role="img" aria-labelledby="title desc">
  <title id="title">Steps on the 100 Britannica pages</title>
  <desc id="desc">Parse, segment, BM25, embed, rerank, compare, drift, site, and Hermes. Counts are from the saved run.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f2744" flood-opacity="0.08"/>
    </filter>
    <marker id="slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1480" height="720" fill="#eef3f8"/>
  <text x="40" y="48" fill="#16324f" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="28" font-weight="700">Steps on the 100 pages</text>
  <text x="40" y="76" fill="#5c6b7a" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="15">Each box is one saved stage. Green, blue, and orange boxes call a Nemotron model. Counts are from this run.</text>

